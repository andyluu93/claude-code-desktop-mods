<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF0F6"/><stop offset="0.5" stop-color="#F6E6FF"/><stop offset="1" stop-color="#FFF6FB"/></linearGradient>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2589A"/><stop offset=".5" stop-color="#FFB3D5"/><stop offset="1" stop-color="#B57CF2"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2"><stop offset="0" stop-color="#F7C6E5" stop-opacity=".45"/><stop offset="1" stop-color="#F7C6E5" stop-opacity="0"/></radialGradient>
<radialGradient id="spark"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".35" stop-color="#FFB3D5" stop-opacity=".6"/><stop offset="1" stop-color="#FFB3D5" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.05"/></radialGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient></defs><style>.fb{transform-box:fill-box;transform-origin:center}
.ob{transform-box:fill-box;transform-origin:center bottom}
.ot{transform-box:fill-box;transform-origin:center top}
.spin{animation:spin 300s linear infinite}
.spinr{animation:spinr 300s linear infinite}
.glint{animation:glint 12s ease-in-out infinite}
.pulse{animation:pulse 6s ease-in-out infinite}
.tw{opacity:0;animation:tw 5s ease-in-out infinite}
.rise{opacity:0;animation:rise 20s linear infinite}
.riseFar{opacity:0;animation:riseFar 24s linear infinite}
.balloon{animation:balloon 26s linear infinite}
.fall{animation:fall 18s linear infinite}
.spinp{animation:spin 6s linear infinite}
.sway{animation:sway 7s ease-in-out infinite}
.bob{animation:bob 4s ease-in-out infinite}
.floatA{animation:floatA 28s ease-in-out infinite}
.floatB{animation:floatB 34s ease-in-out infinite}
.drift{animation:drift 90s linear infinite}
.sand{opacity:0;animation:sand 14s linear infinite}
.wave{animation:wave 14s linear infinite}
.grow{animation:grow 5s ease-in-out infinite}
.flick{animation:flick 7s steps(1) infinite}
.ripple{opacity:0;animation:ripple 4s ease-out infinite}
.comet{fill:none;stroke-linecap:round;stroke-dasharray:24 1976;animation:comet 6s linear infinite}
.shoot{fill:none;stroke-linecap:round;stroke-dasharray:90 3000;animation:shoot 9s ease-in infinite}
